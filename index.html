<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!--
    Search engines and link previews (LinkedIn, Slack, WhatsApp...) do not run
    JavaScript, so they cannot read content.md. The tags below are therefore the
    ONE place where a little text is written by hand. script.js overwrites the
    title and description from content.md once the page loads in a browser.
    If you change your name, title or domain, update these few lines too.
    og:image and og:url must be absolute URLs; every other path in this project is relative.
  -->
  <title>Kartikeya Singh | AI Researcher</title>
  <meta name="description" content="Kartikeya Singh is an AI researcher at KU Leuven working on NLP for low-resource languages, LLMs, and cross-lingual retrieval.">
  <meta name="author" content="Kartikeya Singh">
  <meta name="theme-color" content="#050816">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Kartikeya Singh | AI Researcher">
  <meta property="og:description" content="NLP for low-resource languages, LLMs, and cross-lingual retrieval. Advanced Master's in Artificial Intelligence, KU Leuven.">
  <meta property="og:url" content="https://kartikeyavi.github.io/">
  <meta property="og:image" content="https://kartikeyavi.github.io/images/profile.jpg">
  <meta property="og:image:alt" content="Portrait of Kartikeya Singh">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Kartikeya Singh | AI Researcher">
  <meta name="twitter:description" content="NLP for low-resource languages, LLMs, and cross-lingual retrieval. Advanced Master's in Artificial Intelligence, KU Leuven.">
  <meta name="twitter:image" content="https://kartikeyavi.github.io/images/profile.jpg">

  <!-- Favicon: a single glowing node, inlined so there is no extra file to upload -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23050816'/%3E%3Ccircle cx='32' cy='32' r='20' fill='%2300FFFE' opacity='.22'/%3E%3Ccircle cx='32' cy='32' r='11' fill='%2300FFFE'/%3E%3C/svg%3E">

  <!-- Fonts: Space Grotesk (headings) and Manrope (body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip-link" href="#sections">Skip to content</a>

  <!-- The 3D neural network. Fixed behind the whole page; drawn by script.js with Three.js. -->
  <canvas id="net-canvas" aria-hidden="true"></canvas>

  <!-- HERO. Every piece of text here is filled in from the front matter of content.md. -->
  <header class="hero" id="top">
    <figure class="hero-photo" id="hero-photo" hidden>
      <img id="hero-img" alt="" decoding="async">
    </figure>

    <div class="hero-text">
      <h1 class="hero-name" id="hero-name"></h1>
      <p class="hero-title" id="hero-title"></p>
      <p class="hero-subtitle" id="hero-subtitle"></p>
      <ul class="icon-links" id="hero-links" aria-label="Profiles"></ul>
      <a class="btn" id="hero-cv" hidden download>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m0 0l-4.5-4.5M12 15l4.5-4.5M5 19.5h14"/></svg>
        <span>Download CV</span>
      </a>
    </div>

    <p class="scroll-cue" id="scroll-cue" aria-hidden="true">Scroll to fly into the network</p>
  </header>

  <!-- SECTIONS. One <section> per network node, generated by script.js from content.md. -->
  <main id="sections"></main>

  <!-- MINI MAP of the network. Generated by script.js. -->
  <nav class="minimap" id="minimap" aria-label="Sections" hidden></nav>

  <!-- Shown only if content.md cannot be loaded. -->
  <div class="notice" id="notice" role="alert" hidden></div>

  <noscript>
    <div class="notice">This site needs JavaScript to load its content from <a href="content.md">content.md</a>.</div>
  </noscript>

  <!-- Libraries (CDN, pinned versions). Three.js is loaded by script.js itself; see CONFIG.cdn there. -->
  <script defer src="https://cdn.jsdelivr.net/npm/marked@18.2.0/lib/marked.umd.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/gsap@3.15.1/dist/gsap.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/gsap@3.15.1/dist/ScrollTrigger.min.js"></script>
  <script defer src="script.js"></script>
</body>
</html>
